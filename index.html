<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="description" content="Lern-App für Kinder: Knobeln, Allgemeinbildung und warum Lernen Sinn macht.">
  <title>Lern-Club</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" id="brand"><span id="brand-mascot">🦘</span> <span id="brand-name">Lern-Club</span></a>
    <div class="stats">
      <span class="pill" id="stat-level" title="Stufe">⚡ 1</span>
      <span class="pill" id="stat-streak" title="Serie">🔥 0</span>
      <span class="pill" id="stat-points" title="Punkte">⭐ 0</span>
      <button class="pill lang" id="lang-toggle" aria-label="Sprache wechseln">DE</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav class="bottomnav" id="bottomnav">
    <a href="#/" data-nav="home"><span>🏠</span><small data-t="nav.home">Start</small></a>
    <a href="#/learn" data-nav="learn"><span>🧩</span><small data-t="nav.learn">Lernen</small></a>
    <a href="#/club" data-nav="club"><span>🏛️</span><small data-t="nav.club">Club</small></a>
    <a href="#/me" data-nav="me"><span>🙂</span><small data-t="nav.me">Ich</small></a>
  </nav>

  <script src="data/kaenguru.js"></script>
  <script src="data/puzzles.js"></script>
  <script src="data/warum.js"></script>
  <script src="data/club.js"></script>
  <script src="data/inhalte-es.js"></script>
  <script src="data/spanisch.js"></script>
  <script src="data/sprueche.js"></script>
  <script src="data/skins.js"></script>
  <script src="js/notation.js"></script>
  <script src="data/musik.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-es.js"></script>
  <script src="js/i18n-extra.js"></script>
  <script src="js/i18n-musik.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
